[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-obsidian"
version = "0.1.0"
description = "Conversão local de PDFs digitais e escaneados, com OCR offline para Obsidian"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["PyMuPDF==1.28.2", "PySide6==6.11.2", "markdown-it-py==4.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
pdf-obsidian = "pdf_obsidian.gui:main"
pdf-obsidian-prepare-ocr = "pdf_obsidian.prepare_ocr:main"

[tool.setuptools.package-data]
pdf_obsidian = ["ocr_licenses/*", "ocr_models.json", "ocr_requirements.txt", "qml/*.qml", "qml/components/*.qml", "qml/components/*.js", "assets/manifest.json", "assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/icons/*.svg", "assets/icons/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
